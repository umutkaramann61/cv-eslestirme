{% extends "base.html" %}
{% block title %}{{ 'Yeni ilan' if yeni else 'İlanı düzenle' }}{% endblock %}
{% block content %}
<form class="kart form" method="post">
  <h1>{{ 'Yeni ilan' if yeni else 'İlanı düzenle' }}</h1>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <div class="ikili">
    <label>İlan başlığı *<input name="baslik" required value="{{ ilan.baslik or '' }}" placeholder="Otomasyon Teknisyeni Stajyeri"></label>
    <label>Firma *<input name="firma" required value="{{ ilan.firma or '' }}"></label>
    <label>Konum<input name="konum" value="{{ ilan.konum or '' }}" placeholder="Üsküdar, İstanbul"></label>
    <label>Çalışma türü
      <select name="calisma_turu">
        {% for t in ['Staj', 'Tam zamanlı', 'Yarı zamanlı', 'Çırak / Kalfa', 'Proje bazlı'] %}
        <option {% if ilan.calisma_turu == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
      </select>
    </label>
    <label>Alan<input name="alan" value="{{ ilan.alan or '' }}" placeholder="Otomasyon, Mekatronik, Elektrik…"></label>
    <label>Son başvuru tarihi<input type="date" name="son_tarih" value="{{ ilan.son_tarih or '' }}"></label>
  </div>
  <label>Gerekli beceriler <small>(virgülle ayırın)</small><input name="gerekli_beceriler" value="{{ ilan.gerekli_beceriler or '' }}" placeholder="PLC, pnömatik, teknik resim"></label>
  <label>Tercih sebebi beceriler <small>(virgülle ayırın)</small><input name="tercih_beceriler" value="{{ ilan.tercih_beceriler or '' }}" placeholder="TIA Portal, İngilizce, ehliyet"></label>
  <label>Açıklama<textarea name="aciklama" rows="6">{{ ilan.aciklama or '' }}</textarea></label>
  <label>Başvuru (link veya e-posta/telefon)<input name="basvuru" value="{{ ilan.basvuru or '' }}" placeholder="https://… veya ik@firma.com"></label>
  <label class="kutu"><input type="checkbox" name="aktif" value="1" {% if ilan.aktif %}checked{% endif %}> Yayında</label>
  <div class="dugmeler">
    <button class="btn" type="submit">Kaydet</button>
    <a class="btn ikincil" href="{{ url_for('admin') }}">Vazgeç</a>
  </div>
</form>
{% endblock %}
