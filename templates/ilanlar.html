{% extends "base.html" %}
{% block title %}İlanlar{% endblock %}
{% block content %}
<div class="baslik-satir">
  <h1>Yayındaki ilanlar ({{ ilanlar|length }})</h1>
  <form method="get" class="satir">
    <select name="il" onchange="this.form.submit()">
      <option value="">Tüm iller</option>
      {% for x in S.ILLER %}<option {% if secili_il == x %}selected{% endif %}>{{ x }}</option>{% endfor %}
    </select>
  </form>
</div>
{% for ilan in ilanlar %}
<article class="kart">
  {% include "_ilan_ozet.html" %}
  {% include "_ilan_detay.html" %}
</article>
{% else %}
<p>Şu anda yayında ilan yok.</p>
{% endfor %}
{% endblock %}
